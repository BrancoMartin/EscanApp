# Configuracion de Alembic SOLO para el CLI en desarrollo.
# En runtime (incluido el .exe empaquetado) NO se lee este archivo:
# Backend/migrations_runner.py arma la configuracion en memoria con
# runtime.migrations_dir() y runtime.db_path().
#
#   python -m alembic -c Backend/alembic.ini current
#   python -m alembic -c Backend/alembic.ini history
#   python -m alembic -c Backend/alembic.ini revision --autogenerate -m "descripcion"
#
# %(here)s es la carpeta de este archivo (Backend/), asi los comandos funcionan
# desde cualquier directorio.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
# Base de DESARROLLO del repositorio. Nunca la del cliente.
sqlalchemy.url = sqlite:///pos.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
